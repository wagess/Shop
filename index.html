<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Stéphane Wagner</title>
    <link rel="stylesheet" href="./assets/styles/styles.css">
    <link rel="stylesheet" href="./assets/styles/musique.css">
    <!-- Favicon avec emoji -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
</head>
<body>
    <!-- Modale Spotify -->
    <div id="spotifyModal" class="spotify-modal">
        <div class="spotify-modal-content">
            <div class="spotify-modal-header">
                <h3>Bienvenue dans mon univers visuel</h3>
                <p class="spotify-modal-subtitle">Écoutez ma playlist pendant que vous explorez</p>
            </div>
            <div class="spotify-iframe-container">
                <!-- <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZF1DX1WNn0uqbB04?utm_source=generator&theme=0&autoplay=1" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe> -->
                <!-- <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZF1DX1WNn0uqbB04?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe> -->
                <iframe data-testid="embed-iframe" style="border-radius:12px" src="https://open.spotify.com/embed/playlist/2nvHhKK6erjtYKstNnwfXc?utm_source=generator&theme=0" width="100%" height="352" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
            </div>
            <div class="spotify-modal-actions">
                <button class="btn-secondary" id="closeSpotifyModal">M'accompagner en musique !</button>
                <button class="btn-primary" id="stopSpotifyBtn">Non merci.</button>
            </div>
        </div>
    </div>

    <!-- Header en haut de page, hors container -->
    <header style="width: 100%; padding: var(--gap-large); display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0); position: relative; top: 0; z-index: 100;">
        
        <div style="display: flex; align-items: center; gap: 12px;">
            <img src="./assets/svg/Stéphane Wagner.svg" alt="Logo Stéphane Wagner" style="width: 180px; height: auto; filter: invert(1);">
            <a href="/phototheque.html" target="_self" class="nav-button">
                <span class="nav-text">Photothèque</span>
            </a>
        </div>
        
        <div style="display: flex; align-items: center; gap: 16px;">
            <button id="spotifyNavBtn" title="Écouter ma playlist" style="background: linear-gradient(45deg, #1db954, #1ed760); color: white; border: none; border-radius: 50px; padding: 12px 16px; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: var(--font-size-small); font-weight: var(--font-weight-light); transition: all 0.3s ease; backdrop-filter: blur(10px);">
                <svg id="spotifyNavIcon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <rect x="6" y="6" width="12" height="12" rx="1"/>
                </svg>
            </button>
            <a href="https://www.photographie.stephanewagner.com/" target="_blank" class="nav-button">
                <span class="nav-text">Portfolio</span>
                <span class="nav-icon" style="display: none;">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 6C4 4.89543 4.89543 4 6 4H14C15.1046 4 16 4.89543 16 6V14C16 15.1046 15.1046 16 14 16H6C4.89543 16 4 15.1046 4 14V6Z" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="8.5" cy="8.5" r="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M4 13L7 10L10 13L14 9L16 11" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </a>
            <a href="/stories/" target="_blank" class="nav-button">
                <span class="nav-text">Stories</span>
                <span class="nav-icon" style="display: none;">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 4H16C16.5523 4 17 4.44772 17 5V15C17 15.5523 16.5523 16 16 16H4C3.44772 16 3 15.5523 3 15V5C3 4.44772 3.44772 4 4 4Z" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M6 7H14" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M6 10H14" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M6 13H11" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </a>
        </div>
    </header>

    <div class="container">
        <div class="main-content-wrapper">
            <div class="left-panel">

                <p class="picture-details__title" style="font-size: var(--font-size-large)">Explorez mon univers photographique !</p>
    
                <div class="search-container-modern">
                    <div class="search-input-wrapper">
                        <div class="search-leading">
                            <button type="button" class="search-btn" id="searchOptionsBtn" aria-label="Options de recherche">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M8 2C4.68629 2 2 4.68629 2 8C2 11.3137 4.68629 14 8 14C9.29583 14 10.4957 13.5892 11.4765 12.8907L16.2929 17.7071C16.6834 18.0976 17.3166 18.0976 17.7071 17.7071C18.0976 17.3166 18.0976 16.6834 17.7071 16.2929L12.8907 11.4765C13.5892 10.4957 14 9.29583 14 8C14 4.68629 11.3137 2 8 2ZM4 8C4 5.79086 5.79086 4 8 4C10.2091 4 12 5.79086 12 8C12 10.2091 10.2091 12 8 12C5.79086 12 4 10.2091 4 8Z"></path>
                                </svg>
                            </button>
                        </div>
                        
                        <div class="search-input-container">
                            <input type="text" id="searchInput" placeholder="Rechercher une collection..." autocomplete="off">
                            <div id="searchSuggestions"></div>
                        </div>
                        
                        <div class="search-trailing">
                            <!-- <button type="button" class="search-btn" id="voiceSearchBtn" aria-label="Recherche vocale">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M15.7806 10.1963C16.1326 10.3011 16.3336 10.6714 16.2288 11.0234L16.1487 11.2725C15.3429 13.6262 13.2236 15.3697 10.6644 15.6299L10.6653 16.835H12.0833L12.2171 16.8486C12.5202 16.9106 12.7484 17.1786 12.7484 17.5C12.7484 17.8214 12.5202 18.0894 12.2171 18.1514L12.0833 18.165H7.91632C7.5492 18.1649 7.25128 17.8672 7.25128 17.5C7.25128 17.1328 7.5492 16.8351 7.91632 16.835H9.33527L9.33429 15.6299C6.775 15.3697 4.6558 13.6262 3.84992 11.2725L3.76984 11.0234L3.74445 10.8906C3.71751 10.5825 3.91011 10.2879 4.21808 10.1963C4.52615 10.1047 4.84769 10.2466 4.99347 10.5195L5.04523 10.6436L5.10871 10.8418C5.8047 12.8745 7.73211 14.335 9.99933 14.335C12.3396 14.3349 14.3179 12.7789 14.9534 10.6436L15.0052 10.5195C15.151 10.2466 15.4725 10.1046 15.7806 10.1963ZM12.2513 5.41699C12.2513 4.17354 11.2437 3.16521 10.0003 3.16504C8.75675 3.16504 7.74835 4.17343 7.74835 5.41699V9.16699C7.74853 10.4104 8.75685 11.418 10.0003 11.418C11.2436 11.4178 12.2511 10.4103 12.2513 9.16699V5.41699ZM13.5814 9.16699C13.5812 11.1448 11.9781 12.7479 10.0003 12.748C8.02232 12.748 6.41845 11.1449 6.41828 9.16699V5.41699C6.41828 3.43889 8.02221 1.83496 10.0003 1.83496C11.9783 1.83514 13.5814 3.439 13.5814 5.41699V9.16699Z"></path>
                                </svg>
                            </button> -->
                            
                            <button type="button" class="search-btn search-submit" id="searchSubmitBtn" aria-label="Lancer la recherche">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M10 17.25S2.5 12 2.5 6.5C2.5 4.5 4 3 6 3C7.5 3 8.5 4 10 5.5C11.5 4 12.5 3 14 3C16 3 17.5 4.5 17.5 6.5C17.5 12 10 17.25 10 17.25Z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Liens de navigation vers les dossiers (en haut) -->
                <div id="foldersContainerTop" style="margin: 20px; text-align: center;"></div>

                <!-- Stats et bouton dans un conteneur centré -->
                <div style="display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 20px; margin: 20px 0;">
                    <div class="stats" id="stats"></div>
                    
                    <button id="scrollDownBtn" style="background: rgba(255,255,255,0.1); border: none; border-radius: 50%; width: 48px; height: 48px; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center;" onmouseover="this.style.background='rgba(255,255,255,0.2)'; this.style.transform='translateY(-2px)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'; this.style.transform='translateY(0)'">
                        <img src="./assets/svg/arrow-circle-down-svgrepo-com.svg" width="24" height="24" alt="Scroll down" style="filter: invert(1) opacity(0.8);">
                    </button>
                </div>
            </div>
            
            <div class="right-panel">
                <div class="loading" id="galleriesLoader">
                    <div class="spinner"></div>
                    Chargement des galeries...
                </div>
                <div class="image-container" style="position: relative; width: 100%;">
                    <img id="randomImage" alt="Image aléatoire" style="display: block; width: 100%;">
                    
                    <button class="order-btn" id="randomImageOrderBtn" style="display:none; position: absolute; bottom: 0; left: 50%; transform: translate(-50%, 50%); white-space: nowrap; width: auto;">Commander un tirage</button>
                    
                </div>
            </div>
        </div>

        
        <!-- Album featured -->
        <div id="featuredAlbumSection" style="margin-top: 40px;">
            <div style="padding: 0 var(--gap-large) 20px; display: flex; align-items: center; justify-content: space-between;">
                <h2 id="featuredAlbumTitle" style="color: white; font-weight: 300; margin: 0;">Scènes de vie</h2>
                <a href="/phototheque.html" class="nav-button">Toutes les collections →</a>
            </div>
            <div class="loading" id="featuredAlbumLoader" style="display: none;">
                <div class="spinner"></div>
                Chargement...
            </div>
            <div id="featuredPhotosGrid" class="photos-grid"></div>
        </div>
    </div>

    <div id="photosModal" class="photos-modal">
        <div class="modal-header">
            <button class="close-modal" id="closeModalBtn">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12.7071 4.29289C13.0976 4.68342 13.0976 5.31658 12.7071 5.70711L8.41421 10L12.7071 14.2929C13.0976 14.6834 13.0976 15.3166 12.7071 15.7071C12.3166 16.0976 11.6834 16.0976 11.2929 15.7071L6.29289 10.7071C5.90237 10.3166 5.90237 9.68342 6.29289 9.29289L11.2929 4.29289C11.6834 3.90237 12.3166 3.90237 12.7071 4.29289Z"></path>
                </svg>
            </button>
            <div class="modal-title" id="modalTitle" style="font-size: var(--font-size-large);"></div>
        </div>
        <div id="photosGrid" class="photos-grid"></div>
    </div>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/spotify-modal.js"></script>
</body>
</html>
