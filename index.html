<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Stéphane Wagner</title>
    <link rel="stylesheet" href="./assets/styles/styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/photoswipe@5.4.4/dist/photoswipe.css">
    <link rel="stylesheet" href="./css/lightbox.css">
    <style>
    body {
        position: relative;
        margin: 0;
        padding: 0;
    }
    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: blur(10px);
        z-index: -2;
        transition: background-image 0.5s ease-in-out;
    }
    body::after {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.6);
        z-index: -1;
    }
    
    /* Responsive Design */
    .main-content-wrapper {
        display: flex;
        height: 90vh;
        align-items: center;
    }
    
    .left-panel {
        width: 50%;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    
    .right-panel {
        width: 50%;
        padding: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    #randomImage {
        aspect-ratio: 3/2;
        max-width: 90%;
        max-height: 70%;
        object-fit: cover;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        transition: opacity 0.3s ease-in-out;
        background-color: #2a2a2a;
        background-image: linear-gradient(45deg, #333 25%, transparent 25%), 
                         linear-gradient(-45deg, #333 25%, transparent 25%), 
                         linear-gradient(45deg, transparent 75%, #333 75%), 
                         linear-gradient(-45deg, transparent 75%, #333 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    
    /* Mobile Design */
    @media (max-width: 768px) {
        .main-content-wrapper {
            flex-direction: column;
            height: auto;
            min-height: 80vh;
        }
        
        .left-panel {
            width: 100%;
            padding: 15px;
            order: 1;
        }
        
        .right-panel {
            width: 100%;
            padding: 15px;
            order: 2;
            min-height: 250px;
        }
        
        #randomImage {
            aspect-ratio: 16/9;
            max-width: 100%;
            max-height: 250px;
            width: 100%;
        }
        
        .header h1 {
            font-size: 1.5rem;
            text-align: center;
        }
        
        .header p {
            text-align: center;
            font-size: 0.9rem;
        }
        
        .search-container {
            margin: 15px 0;
        }
        
        #galleriesContainer {
            padding: 10px;
        }
        
        .galleries-grid {
            grid-template-columns: 1fr;
            gap: 15px;
        }
    }
    
    /* Tablet Design */
    @media (max-width: 1024px) and (min-width: 769px) {
        .left-panel, .right-panel {
            padding: 15px;
        }
        
        #randomImage {
            max-width: 95%;
            max-height: 60%;
        }
        
        .galleries-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-content-wrapper">
            <div class="left-panel">
                <div class="header">
                    <h1>📸 Shop Stéphane Wagner</h1>
                    <p>Explorez vos collections photo</p>
                </div>

                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="🔍 Rechercher une collection..." autocomplete="off">
                    <div id="searchSuggestions"></div>
                </div>

                <!-- Liens de navigation vers les dossiers (en haut) -->
                <div id="foldersContainerTop" style="margin-top: 20px; margin-bottom: 20px; text-align: center;"></div>

                <div class="stats" id="stats"></div>
            </div>
            
            <div class="right-panel">
                <img id="randomImage" alt="Image aléatoire">
            </div>
        </div>

        <div id="galleriesContainer" class="galleries-grid">
            <div class="loading">
                <div class="spinner"></div>
                Chargement des galeries...
            </div>
        </div>

        <!-- Liens de navigation vers les dossiers (en bas) -->
        <div id="foldersContainerBottom" style="margin-top: 20px; margin-bottom: 20px; text-align: center;"></div>
    </div>

    <div id="photosModal" class="photos-modal">
        <div class="modal-header">
            <button class="close-modal" id="closeModalBtn">←</button>
            <div class="modal-title" id="modalTitle"></div>
        </div>
        <div id="photosGrid" class="photos-grid"></div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
