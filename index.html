<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop Stéphane Wagner</title>
    <link rel="stylesheet" href="./assets/styles/styles.css">
    <!-- Favicon avec emoji -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
</head>
<body>
    <!-- Header en haut de page, hors container -->
    <header style="width: 100%; padding: var(--gap-large); display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0); position: relative; top: 0; z-index: 100;">
        
        <div style="display: flex; align-items: center; gap: 12px;">
            <img src="./assets/svg/Stéphane Wagner.svg" alt="Logo Stéphane Wagner" style="width: 180px; height: auto; filter: invert(1);">
            
        </div>
        <h4 style="margin: 0; color: white; font-size: var(--font-size-small); font-weight: var(--font-weight-light); border: 1px solid white; border-radius: 2px; padding: 8px 16px;">ShopPhoto</h4>
    </header>

    <div class="container">
        <div class="main-content-wrapper">
            <div class="left-panel">

                <p style="margin: 0; color: rgb(169, 169, 169); font-size: var(--font-size-large); font-weight: 100; text-align: center;">Explorez mon univers photographique !</p>
    
                <div class="search-container-modern">
                    <div class="search-input-wrapper">
                        <div class="search-leading">
                            <button type="button" class="search-btn" id="searchOptionsBtn" aria-label="Options de recherche">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M9.33496 16.5V10.665H3.5C3.13273 10.665 2.83496 10.3673 2.83496 10C2.83496 9.63273 3.13273 9.33496 3.5 9.33496H9.33496V3.5C9.33496 3.13273 9.63273 2.83496 10 2.83496C10.3673 2.83496 10.665 3.13273 10.665 3.5V9.33496H16.5L16.6338 9.34863C16.9369 9.41057 17.165 9.67857 17.165 10C17.165 10.3214 16.9369 10.5894 16.6338 10.6514L16.5 10.665H10.665V16.5C10.665 16.8673 10.3673 17.165 10 17.165C9.63273 17.165 9.33496 16.8673 9.33496 16.5Z"></path>
                                </svg>
                            </button>
                        </div>
                        
                        <div class="search-input-container">
                            <input type="text" id="searchInput" placeholder="🔍 Rechercher une collection..." autocomplete="off">
                            <div id="searchSuggestions"></div>
                        </div>
                        
                        <div class="search-trailing">
                            <button type="button" class="search-btn" id="voiceSearchBtn" aria-label="Recherche vocale">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M15.7806 10.1963C16.1326 10.3011 16.3336 10.6714 16.2288 11.0234L16.1487 11.2725C15.3429 13.6262 13.2236 15.3697 10.6644 15.6299L10.6653 16.835H12.0833L12.2171 16.8486C12.5202 16.9106 12.7484 17.1786 12.7484 17.5C12.7484 17.8214 12.5202 18.0894 12.2171 18.1514L12.0833 18.165H7.91632C7.5492 18.1649 7.25128 17.8672 7.25128 17.5C7.25128 17.1328 7.5492 16.8351 7.91632 16.835H9.33527L9.33429 15.6299C6.775 15.3697 4.6558 13.6262 3.84992 11.2725L3.76984 11.0234L3.74445 10.8906C3.71751 10.5825 3.91011 10.2879 4.21808 10.1963C4.52615 10.1047 4.84769 10.2466 4.99347 10.5195L5.04523 10.6436L5.10871 10.8418C5.8047 12.8745 7.73211 14.335 9.99933 14.335C12.3396 14.3349 14.3179 12.7789 14.9534 10.6436L15.0052 10.5195C15.151 10.2466 15.4725 10.1046 15.7806 10.1963ZM12.2513 5.41699C12.2513 4.17354 11.2437 3.16521 10.0003 3.16504C8.75675 3.16504 7.74835 4.17343 7.74835 5.41699V9.16699C7.74853 10.4104 8.75685 11.418 10.0003 11.418C11.2436 11.4178 12.2511 10.4103 12.2513 9.16699V5.41699ZM13.5814 9.16699C13.5812 11.1448 11.9781 12.7479 10.0003 12.748C8.02232 12.748 6.41845 11.1449 6.41828 9.16699V5.41699C6.41828 3.43889 8.02221 1.83496 10.0003 1.83496C11.9783 1.83514 13.5814 3.439 13.5814 5.41699V9.16699Z"></path>
                                </svg>
                            </button>
                            
                            <button type="button" class="search-btn search-submit" id="searchSubmitBtn" aria-label="Lancer la recherche">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M7.167 15.416V4.583a.75.75 0 0 1 1.5 0v10.833a.75.75 0 0 1-1.5 0Zm4.166-2.5V7.083a.75.75 0 0 1 1.5 0v5.833a.75.75 0 0 1-1.5 0ZM3 11.25V8.75a.75.75 0 0 1 1.5 0v2.5a.75.75 0 0 1-1.5 0Zm12.5 0V8.75a.75.75 0 0 1 1.5 0v2.5a.75.75 0 0 1-1.5 0Z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Liens de navigation vers les dossiers (en haut) -->
                <div id="foldersContainerTop" style="margin: 20px; text-align: center;"></div>

                <!-- Stats et bouton dans un conteneur centré -->
                <div style="display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 20px; margin: 20px 0;">
                    <div class="stats" id="stats"></div>
                    
                    <button id="scrollDownBtn" style="background: rgba(255,255,255,0.1); border: none; border-radius: 50%; width: 48px; height: 48px; cursor: pointer; transition: all 0.3s ease; backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center;" onmouseover="this.style.background='rgba(255,255,255,0.2)'; this.style.transform='translateY(-2px)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'; this.style.transform='translateY(0)'">
                        <img src="./assets/svg/arrow-circle-down-svgrepo-com.svg" width="24" height="24" alt="Scroll down" style="filter: invert(1) opacity(0.8);">
                    </button>
                </div>
            </div>
            
            <div class="right-panel">
                <div class="loading" id="galleriesLoader">
                    <div class="spinner"></div>
                    Chargement des galeries...
                </div>
                <img id="randomImage" alt="Image aléatoire">
            </div>
        </div>

        
        <div id="galleriesContainer" class="galleries-grid">
        </div>

        <!-- Liens de navigation vers les dossiers (en bas) -->
        <div id="foldersContainerBottom" style="margin: 40px; text-align: center;"></div>
    </div>

    <div id="photosModal" class="photos-modal">
        <div class="modal-header">
            <button class="close-modal" id="closeModalBtn">←</button>
            <div class="modal-title" id="modalTitle"></div>
        </div>
        <div id="photosGrid" class="photos-grid"></div>
    </div>

    <script type="module" src="js/app.js"></script>
    <script>
        document.getElementById('scrollDownBtn').addEventListener('click', () => {
            const galleriesContainer = document.getElementById('galleriesContainer');
            if (galleriesContainer) {
                galleriesContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        });
    </script>
</body>
</html>
