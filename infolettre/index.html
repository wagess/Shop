<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{SUJET}}</title>
<style>
  @import url('https://fonts.cdnfonts.com/css/general-sans');

  strong { font-weight:600 !important; }

  @media only screen and (max-width:620px) {
    .outer-wrap  { padding:0 !important; }
    .inner-table { width:100% !important; }
    .pad         { padding-left:20px !important; padding-right:20px !important; }
    .pad-top     { padding-left:20px !important; padding-right:20px !important; padding-top:20px !important; }
    .header-left,
    .header-right { display:block !important; width:100% !important; text-align:center !important; }
    .header-right { padding-top:4px !important; }
    .title-h1    { font-size:20px !important; }
    .corps-h2    { font-size:17px !important; }
    .corps-pad   { padding:24px 20px 20px !important; }
    .btn         { padding:12px 20px !important; font-size:11px !important; }
    .social-btn  { padding:6px 10px !important; font-size:10px !important; }
  }
</style>
</head>
<body style="margin:0;padding:0;background:#f5f5f5;font-family:'General Sans Variable','General Sans','Helvetica Neue',Helvetica,Arial,sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" class="outer-wrap" style="background:#f5f5f5;padding:32px 0;">
    <tr>
      <td align="center">
        <table width="600" cellpadding="0" cellspacing="0" class="inner-table" style="background:#ffffff;max-width:600px;width:100%;">

          <!-- Bannière promo -->
          <tr>
            <td class="promo-banner" style="background:linear-gradient(135deg, #f5c842 0%, #56b4d3 100%);padding:14px 40px;text-align:center;">
              <span style="font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#1f1f1f;font-weight:400;font-family:'General Sans Variable','General Sans','Helvetica Neue',sans-serif;">
                ✦ &nbsp;−20 % sur votre première commande&nbsp; ✦
              </span>
            </td>
          </tr>

          <!-- En-tête -->
          <tr>
            <td style="padding:28px 40px 0;" class="pad-top">
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td class="header-left" style="text-align:left;">
                    <p style="margin:0;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#999999;font-family:'General Sans Variable','General Sans','Helvetica Neue',sans-serif;font-weight:500;">Stéphane Wagner · Photographie</p>
                  </td>
                  <td class="header-right" style="text-align:right;">
                    <p style="margin:0;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#b8b8b8;font-family:'General Sans Variable','General Sans','Helvetica Neue',sans-serif;">{{SERIE}}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Titre + numéro intégré -->
          <tr>
            <td style="padding:20px 40px 0;" class="pad">
              <h1 class="title-h1" style="margin:0;font-size:24px;font-weight:500;color:#1f1f1f;line-height:1.3;font-family:'General Sans Variable','General Sans','Helvetica Neue',sans-serif;">
                La série de l'été - {{NUMERO}}
              </h1>
            </td>
          </tr>

          <!-- Intro générale -->
          <tr>
            <td style="padding:16px 40px 0;" class="pad">
              <div style="font-size:15px;line-height:1.6;color:#3d3d3d;font-family:'General Sans Variable','General Sans','Helvetica Neue',sans-serif;">
                {{INTRO}}
              </div>
            </td>
          </tr>

          <!-- Photo principale -->
          <tr>
            <td style="padding:20px 0 0;">
              <img src="{{PHOTO_URL}}" alt="{{PHOTO_ALT}}" width="600" style="display:block;width:100%;height:auto;max-height:420px;object-fit:cover;">
            </td>
          </tr>

          <!-- Corps de texte -->
          <tr>
            <td class="corps-pad" style="padding:28px 40px 20px;">
              <div class="corps-head" style="display:flex;align-items:center;justify-content:space-between;">
                <h2 class="corps-h2" style="margin:0;font-size:19px;font-weight:500;color:#1f1f1f;line-height:1.3;font-family:'General Sans Variable','General Sans','Helvetica Neue',sans-serif;">{{TITRE}}</h2>
                <span class="corps-num" style="flex-shrink:0;margin-left:16px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#999999;font-family:'General Sans Variable','General Sans','Helvetica Neue',sans-serif;">{{NUMERO}}</span>
              </div>
              <br>
              <div style="font-size:17px;line-height:1.7;color:#3d3d3d;font-family:'General Sans Variable','General Sans','Helvetica Neue',sans-serif;">
                {{CORPS}}
              </div>
            </td>
          </tr>

          <!-- CTA article -->
          <tr>
            <td class="pad" style="padding:0 40px 28px;text-align:center;">
              {{ARTICLE_BTN}}
            </td>
          </tr>

          <!-- Séparateur -->
          <tr>
            <td class="pad" style="padding:0 40px;">
              <hr style="border:none;border-top:1px solid #eeeeee;margin:0;">
            </td>
          </tr>

          <!-- CTA série -->
          <tr>
            <td class="pad" style="padding:28px 40px 20px;text-align:center;">
              <a href="{{CTA_URL}}" class="btn" style="display:inline-block;padding:14px 28px;background:#1f1f1f;color:#ffffff;text-decoration:none;font-size:11px;letter-spacing:2px;text-transform:uppercase;font-family:'General Sans Variable','General Sans','Helvetica Neue',sans-serif;font-weight:500;border-radius:2px;">{{CTA_TEXTE}}</a>
            </td>
          </tr>

          <!-- Pied de page -->
          <tr>
            <td class="pad" style="padding:20px 40px;border-top:1px solid #eeeeee;text-align:center;">
              <p style="margin:0;font-size:11px;color:#b8b8b8;line-height:1.6;font-family:'General Sans Variable','General Sans','Helvetica Neue',sans-serif;">
                Vous recevez ce courriel car vous êtes abonné à la liste de Stéphane Wagner.<br>
                <a href="*|UNSUB|*" style="color:#b8b8b8;">Se désabonner</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
