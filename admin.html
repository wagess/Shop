<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Visibilité collections</title>
<link rel="stylesheet" href="./docs/tokens.css">
<link rel="stylesheet" href="./assets/styles/components/toggle.css">
<style>
  @import url('https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--color-bg-primary);
    color: var(--color-text-primary);
    font-family: var(--font-family-base);
    font-size: var(--font-body-caption-size);
    line-height: var(--font-body-caption-line-height);
    min-height: 100vh;
  }

  /* ── Login ── */
  #login {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }

  .login-box {
    background: var(--color-bg-secondary);
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--radius-firm);
    padding: 48px;
    width: 360px;
    text-align: center;
  }

  .login-box h1 {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
    margin-bottom: 32px;
    font-weight: 500;
  }

  .login-box input {
    width: 100%;
    padding: 12px 16px;
    background: var(--color-bg-primary);
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--radius-firm);
    color: var(--color-text-primary);
    font-family: var(--font-family-base);
    font-size: var(--font-body-caption-size);
    margin-bottom: 12px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .login-box input:focus { border-color: var(--color-border-primary); }

  .login-box button {
    width: 100%;
    padding: 14px;
    background: var(--color-core-primary-b);
    color: var(--color-core-primary-a);
    border: none;
    border-radius: var(--radius-circular);
    font-family: var(--font-family-base);
    font-size: var(--font-body-caption-size);
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .login-box button:hover { opacity: 0.85; }

  .login-error {
    color: var(--color-core-secondary-red);
    font-size: 12px;
    margin-top: 12px;
    min-height: 18px;
  }

  /* ── Dashboard ── */
  #dashboard { display: none; }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--color-bg-secondary);
    border-bottom: 1px solid var(--color-border-secondary);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }

  .topbar-left { display: flex; align-items: center; gap: 24px; }

  .topbar h1 {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
    font-weight: 500;
  }

  .stats {
    font-size: 12px;
    color: var(--color-text-tertiary);
  }

  .stats span {
    color: var(--color-text-primary);
    font-weight: 500;
  }

  .topbar-right { display: flex; gap: 8px; align-items: center; }

  .btn {
    height: 36px;
    padding: 0 16px;
    font-family: var(--font-family-base);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    border-radius: var(--radius-circular);
    border: none;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }

  .btn:hover { opacity: 0.8; }

  .btn-save {
    background: var(--color-core-primary-b);
    color: var(--color-core-primary-a);
  }

  .btn-save:disabled {
    background: var(--color-bg-active);
    color: var(--color-text-tertiary);
    cursor: default;
    opacity: 1;
  }

  .btn-logout {
    background: transparent;
    color: var(--color-text-tertiary);
    border: 1px solid var(--color-border-secondary);
  }

  .unsaved {
    font-size: 12px;
    color: var(--color-core-primary-yellow);
    letter-spacing: 0.02em;
  }

  /* ── Barre de recherche ── */
  .search-bar {
    padding: 12px 32px;
    border-bottom: 1px solid var(--color-border-secondary);
  }

  .search-bar input {
    width: 100%;
    max-width: 400px;
    height: 40px;
    padding: 0 16px;
    background: var(--color-bg-secondary);
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--radius-circular);
    color: var(--color-text-primary);
    font-family: var(--font-family-base);
    font-size: var(--font-body-caption-size);
    outline: none;
    transition: border-color 0.15s ease;
  }

  .search-bar input:focus { border-color: var(--color-border-primary); }

  .search-bar input::placeholder { color: var(--color-text-tertiary); }

  /* ── Contenu ── */
  .main { padding: 24px 32px; }

  /* ── Dossiers ── */
  .folder-section { margin-bottom: 6px; }

  .folder-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--color-bg-secondary);
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--radius-firm);
    cursor: pointer;
    user-select: none;
    gap: 12px;
    transition: border-color 0.15s ease;
  }

  .folder-header:hover { border-color: var(--color-border-primary); }

  .folder-section.open .folder-header {
    border-bottom-left-radius: 0;
    border-bottom-right-radius: 0;
  }

  .folder-header-left { display: flex; align-items: center; gap: 12px; flex: 1; }

  .folder-chevron {
    font-size: 10px;
    color: var(--color-text-tertiary);
    transition: transform 0.2s ease;
  }

  .folder-section.open .folder-chevron { transform: rotate(90deg); }

  .folder-name {
    font-size: var(--font-headline-body-size);
    font-weight: var(--font-headline-body-weight);
    letter-spacing: var(--font-headline-body-letter-spacing);
    color: var(--color-text-primary);
  }

  .folder-count {
    font-size: 12px;
    color: var(--color-text-tertiary);
  }

  /* ── Collections ── */
  .collections-list {
    border: 1px solid var(--color-border-secondary);
    border-top: none;
    border-radius: 0 0 var(--radius-firm) var(--radius-firm);
    display: none;
    overflow: hidden;
  }

  .folder-section.open .collections-list { display: block; }

  .collection-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px 10px 36px;
    border-bottom: 1px solid var(--color-border-secondary);
    transition: background 0.1s ease;
  }

  .collection-row:last-child { border-bottom: none; }

  .collection-row:hover { background: var(--color-hover-primary); }

  .collection-row.hidden-row { opacity: 0.4; }

  .collection-name {
    font-size: var(--font-body-caption-size);
    font-weight: var(--font-body-caption-weight);
    color: var(--color-text-primary);
  }

  .collection-id {
    font-size: 11px;
    color: var(--color-text-tertiary);
    margin-left: 8px;
    letter-spacing: 0.05em;
  }

  /* ── Toggle Sigma — surcharge dark ── */
  .toggle--off      { background: var(--color-bg-active); }
  .toggle--on       { background: var(--color-core-primary-b); }
  .toggle--on .toggle__thumb { background: var(--color-core-primary-a); }
  .toggle--disabled { background: var(--color-bg-disabled); }

  /* ── États vides / loader ── */
  .loader {
    padding: 48px;
    text-align: center;
    color: var(--color-text-tertiary);
  }

  .empty {
    padding: 32px;
    text-align: center;
    color: var(--color-text-tertiary);
  }

  /* ── Collection mise en avant ── */
  .featured-bar {
    padding: 12px 32px;
    border-bottom: 1px solid var(--color-border-secondary);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .featured-bar label {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
    white-space: nowrap;
    font-weight: 500;
  }

  .featured-bar select {
    height: 36px;
    padding: 0 14px;
    background: var(--color-bg-secondary);
    border: 1px solid var(--color-border-secondary);
    border-radius: var(--radius-circular);
    color: var(--color-text-primary);
    font-family: var(--font-family-base);
    font-size: var(--font-body-caption-size);
    outline: none;
    cursor: pointer;
    min-width: 220px;
    transition: border-color 0.15s ease;
  }

  .featured-bar select:focus { border-color: var(--color-border-primary); }

  .featured-hint {
    font-size: 11px;
    color: var(--color-text-tertiary);
    margin-left: auto;
  }

  /* ── Collections sans dossier ── */
  .standalone-section { margin-bottom: 6px; }

  .standalone-header {
    padding: 10px 16px;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
    border-bottom: 1px solid var(--color-border-secondary);
    background: var(--color-bg-secondary);
    border-radius: var(--radius-firm) var(--radius-firm) 0 0;
    border: 1px solid var(--color-border-secondary);
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h1>Stéphane Wagner · Admin</h1>
    <input type="password" id="passwordInput" placeholder="Mot de passe" autocomplete="current-password">
    <button onclick="tryLogin()">Accéder</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-left">
      <h1>Visibilité des collections</h1>
      <div class="stats" id="stats">—</div>
    </div>
    <div class="topbar-right">
      <span class="unsaved" id="unsavedBadge" style="display:none">● Non sauvegardé</span>
      <button class="btn btn-save" id="saveBtn" disabled onclick="saveConfig()">Sauvegarder</button>
      <button class="btn btn-logout" onclick="logout()">Déconnexion</button>
    </div>
  </div>

  <div class="featured-bar">
    <label for="featuredSelect">Collection mise en avant</label>
    <select id="featuredSelect" onchange="setFeatured(this.value)">
      <option value="">— Choisir —</option>
    </select>
    <span class="featured-hint" id="featuredHint"></span>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Rechercher une collection…" oninput="filterList()">
  </div>

  <div class="main" id="main">
    <div class="loader">Chargement des collections…</div>
  </div>
</div>

<script type="module">
import { createToggle } from './js/components/toggle.js';
window.createToggle = createToggle;
</script>

<script>
const PASSWORD  = 'sw2024';
const WP_BASE   = 'https://www.photographie.stephanewagner.com';
const IS_LOCAL  = ['localhost', '127.0.0.1', '0.0.0.0'].includes(location.hostname)
               || location.hostname.endsWith('.local')
               || location.port === '8888';
const API_BASE  = IS_LOCAL
  ? null
  : `${WP_BASE}/wp-json/wplr/v1`;
const TOKEN     = 'EDNusnA0Q8TW';
const SAVE_URL  = './admin-save.php';

function adminFetch(path, options = {}) {
  const url = IS_LOCAL
    ? `/proxy.php?path=${encodeURIComponent(path)}`
    : `${WP_BASE}${path}`;
  if (!IS_LOCAL) {
    options.headers = { ...options.headers, Authorization: `Bearer ${TOKEN}` };
  }
  return fetch(url, options);
}

let config     = { featured_collection: '', collections: {}, folders: {} };
let hierarchy  = null;
let isDirty    = false;

// --- AUTH ---
function tryLogin() {
  const val = document.getElementById('passwordInput').value;
  if (val === PASSWORD) {
    sessionStorage.setItem('admin_auth', '1');
    document.getElementById('login').style.display    = 'none';
    document.getElementById('dashboard').style.display = 'block';
    init();
  } else {
    document.getElementById('loginError').textContent = 'Mot de passe incorrect.';
  }
}
document.getElementById('passwordInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') tryLogin();
});
function logout() {
  sessionStorage.removeItem('admin_auth');
  location.reload();
}
if (sessionStorage.getItem('admin_auth') === '1') {
  document.getElementById('login').style.display    = 'none';
  document.getElementById('dashboard').style.display = 'block';
  init();
}

// --- INIT ---
async function init() {
  const [hier, cfg] = await Promise.all([
    adminFetch('/wp-json/wplr/v1/hierarchy').then(r => r.json()),
    fetch(SAVE_URL).then(r => r.json()).catch(() => ({ collections: {}, folders: {} })),
  ]);
  hierarchy = hier;
  config    = { featured_collection: '', collections: {}, folders: {}, ...cfg };
  renderDashboard();
}

// --- DATA ---
function isVisible(type, id) {
  const map = config[type] || {};
  return map[id] !== false; // absent = visible par défaut
}

function toggle(type, id, value) {
  if (!config[type]) config[type] = {};
  config[type][id] = value;
  markDirty();
  updateStats();
}

function markDirty() {
  isDirty = true;
  document.getElementById('unsavedBadge').style.display = 'inline';
  document.getElementById('saveBtn').disabled = false;
}

function updateStats() {
  const allC = countAll('collections');
  const hidC = countHidden('collections');
  const allF = countAll('folders');
  const hidF = countHidden('folders');
  document.getElementById('stats').innerHTML =
    `Collections : <span>${allC - hidC}</span>/${allC} visibles &nbsp;·&nbsp; ` +
    `Dossiers : <span>${allF - hidF}</span>/${allF} visibles`;
}

function countAll(type) {
  if (!hierarchy) return 0;
  return flatItems(type).length;
}
function countHidden(type) {
  return Object.values(config[type] || {}).filter(v => v === false).length;
}

function flatItems(type) {
  const result = [];
  function walk(node) {
    if (Array.isArray(node)) { node.forEach(walk); return; }
    if (!node || typeof node !== 'object') return;
    if (type === 'folders'     && node.type === 'folder')      result.push(node);
    if (type === 'collections' && node.type !== 'folder' && node.id) result.push(node);
    for (const k of ['children','items','galleries','collections']) {
      if (node[k]) walk(node[k]);
    }
  }
  walk(hierarchy);
  return result;
}

// --- RENDER ---
function renderDashboard() {
  const main = document.getElementById('main');
  if (!hierarchy) { main.innerHTML = '<div class="loader">Erreur de chargement.</div>'; return; }

  const folders = flatItems('folders');
  const allCols = flatItems('collections');

  // Associer chaque collection à son dossier parent
  const colsByFolder = {};
  const standaloneC  = [];

  function buildMap(node, currentFolder) {
    if (Array.isArray(node)) { node.forEach(n => buildMap(n, currentFolder)); return; }
    if (!node || typeof node !== 'object') return;
    if (node.type === 'folder') {
      for (const k of ['children','items','galleries','collections']) {
        if (node[k]) buildMap(node[k], node.id);
      }
      return;
    }
    if (node.id) {
      if (currentFolder) {
        if (!colsByFolder[currentFolder]) colsByFolder[currentFolder] = [];
        colsByFolder[currentFolder].push(node);
      } else {
        standaloneC.push(node);
      }
    }
  }
  buildMap(hierarchy, null);

  let html = '';

  // Dossiers + leurs collections
  folders.forEach(folder => {
    const cols    = colsByFolder[folder.id] || [];
    const visible = isVisible('folders', folder.id);
    html += `
    <div class="folder-section open" id="folder-section-${folder.id}">
      <div class="folder-header" onclick="toggleSection('${folder.id}')">
        <div class="folder-header-left">
          <span class="folder-chevron">▶</span>
          <span class="folder-name">${folder.name || folder.id}</span>
          <span class="folder-count">${cols.length} collection${cols.length > 1 ? 's' : ''}</span>
        </div>
        <div class="toggle-mount" data-toggle-type="folder" data-toggle-id="${folder.id}" data-toggle-checked="${visible}" onclick="event.stopPropagation()"></div>
      </div>
      <div class="collections-list">
        ${cols.map(c => renderCollectionRow(c)).join('') || '<div class="empty">Aucune collection</div>'}
      </div>
    </div>`;
  });

  // Collections sans dossier
  if (standaloneC.length) {
    html += `<div class="standalone-section">
      <div class="standalone-header">Sans dossier</div>
      <div class="collections-list" style="display:block;">
        ${standaloneC.map(c => renderCollectionRow(c)).join('')}
      </div>
    </div>`;
  }

  main.innerHTML = html || '<div class="empty">Aucune donnée.</div>';
  mountToggles(main);
  populateFeaturedSelect();
  updateStats();
}

async function mountToggles(container) {
  // Attendre que le module toggle soit prêt (chargement asynchrone)
  if (!window.createToggle) {
    await new Promise(resolve => {
      const check = setInterval(() => {
        if (window.createToggle) { clearInterval(check); resolve(); }
      }, 20);
    });
  }

  container.querySelectorAll('.toggle-mount').forEach(mount => {
    const type    = mount.dataset.toggleType;
    const id      = mount.dataset.toggleId;
    const checked = mount.dataset.toggleChecked === 'true';

    const t = window.createToggle({
      checked,
      onChange: val => {
        if (type === 'folder') toggleFolder(id, val);
        else                   toggleCollection(id, val);
      },
    });

    mount.replaceWith(t);
  });
}

function renderCollectionRow(c) {
  const visible = isVisible('collections', c.id);
  return `
  <div class="collection-row ${visible ? '' : 'hidden-row'}" id="crow-${c.id}">
    <span>
      <span class="collection-name">${c.name || c.title || 'Sans nom'}</span>
      <span class="collection-id">ID ${c.id}</span>
    </span>
    <div class="toggle-mount" data-toggle-type="collection" data-toggle-id="${c.id}" data-toggle-checked="${visible}"></div>
  </div>`;
}

function toggleSection(folderId) {
  document.getElementById(`folder-section-${folderId}`).classList.toggle('open');
}

function toggleFolder(id, value) {
  toggle('folders', id, value);
  const section = document.getElementById(`folder-section-${id}`);
  if (section) section.style.opacity = value ? '1' : '.5';
}

function toggleCollection(id, value) {
  toggle('collections', id, value);
  const row = document.getElementById(`crow-${id}`);
  if (row) row.classList.toggle('hidden-row', !value);
}

// --- FEATURED ---
function populateFeaturedSelect() {
  const select = document.getElementById('featuredSelect');
  if (!select) return;
  const allCols = flatItems('collections')
    .slice()
    .sort((a, b) => (a.name || '').localeCompare(b.name || '', 'fr'));
  select.innerHTML = '<option value="">— Choisir —</option>' +
    allCols.map(c => {
      const name = c.name || 'Sans nom';
      const sel  = config.featured_collection === name ? ' selected' : '';
      return `<option value="${name}"${sel}>${name}</option>`;
    }).join('');
  updateFeaturedHint();
}

function setFeatured(name) {
  config.featured_collection = name;
  markDirty();
  updateFeaturedHint();
}

function updateFeaturedHint() {
  const hint = document.getElementById('featuredHint');
  if (!hint) return;
  hint.textContent = config.featured_collection
    ? `Affiché sur index.html`
    : '';
}

// --- SEARCH ---
function filterList() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  document.querySelectorAll('.collection-row').forEach(row => {
    const text = row.textContent.toLowerCase();
    row.style.display = (!q || text.includes(q)) ? '' : 'none';
  });
  document.querySelectorAll('.folder-section').forEach(section => {
    const visible = [...section.querySelectorAll('.collection-row')]
      .some(r => r.style.display !== 'none');
    section.style.display = (!q || visible) ? '' : 'none';
  });
}

// --- SAVE ---
async function saveConfig() {
  const btn = document.getElementById('saveBtn');
  btn.textContent = 'Sauvegarde…';
  btn.disabled = true;
  try {
    const resp = await fetch(SAVE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    isDirty = false;
    document.getElementById('unsavedBadge').style.display = 'none';
    btn.textContent = 'Sauvegardé ✓';
    setTimeout(() => { btn.textContent = 'Sauvegarder'; }, 2000);
  } catch (e) {
    btn.textContent = 'Erreur — réessayer';
    btn.disabled = false;
    alert('Erreur lors de la sauvegarde : ' + e.message);
  }
}

window.addEventListener('beforeunload', e => {
  if (isDirty) e.preventDefault();
});
</script>
<script>
document.addEventListener('contextmenu', e => { if (e.target.tagName === 'IMG') e.preventDefault(); });
document.addEventListener('dragstart',   e => { if (e.target.tagName === 'IMG') e.preventDefault(); });
</script>
</body>
</html>
