<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Visibilité collections</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0e0e0e;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --muted: #666;
    --accent: #fff;
    --danger: #e05555;
    --success: #4caf7d;
    --toggle-off: #333;
    --toggle-on: #4caf7d;
  }

  body { background: var(--bg); color: var(--text); font-family: 'Georgia', serif; min-height: 100vh; }

  /* LOGIN */
  #login {
    display: flex; align-items: center; justify-content: center; min-height: 100vh;
  }
  .login-box {
    background: var(--surface); border: 1px solid var(--border);
    padding: 48px; width: 360px; text-align: center;
  }
  .login-box h1 { font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); margin-bottom: 32px; font-weight: 400; }
  .login-box input {
    width: 100%; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); font-size: 14px; margin-bottom: 16px; outline: none; font-family: inherit;
  }
  .login-box input:focus { border-color: #555; }
  .login-box button {
    width: 100%; padding: 12px; background: var(--accent); color: #000;
    border: none; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; font-family: inherit;
  }
  .login-error { color: var(--danger); font-size: 12px; margin-top: 12px; min-height: 18px; }

  /* DASHBOARD */
  #dashboard { display: none; }

  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px 32px; display: flex; align-items: center; justify-content: space-between;
  }
  .topbar-left { display: flex; align-items: center; gap: 24px; }
  .topbar h1 { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: var(--muted); font-weight: 400; }
  .stats { font-size: 12px; color: var(--muted); }
  .stats span { color: var(--text); font-weight: bold; }

  .topbar-right { display: flex; gap: 12px; align-items: center; }
  .btn {
    padding: 8px 20px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    border: none; cursor: pointer; font-family: inherit; transition: opacity .2s;
  }
  .btn:hover { opacity: .8; }
  .btn-save { background: var(--accent); color: #000; }
  .btn-save:disabled { background: #333; color: #666; cursor: default; opacity: 1; }
  .btn-logout { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .unsaved { font-size: 11px; color: #f0a500; letter-spacing: 1px; }

  .search-bar {
    padding: 16px 32px; border-bottom: 1px solid var(--border);
  }
  .search-bar input {
    width: 100%; max-width: 400px; padding: 10px 16px;
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); font-size: 13px; outline: none; font-family: inherit;
  }
  .search-bar input:focus { border-color: #555; }

  .main { padding: 24px 32px; }

  .folder-section { margin-bottom: 8px; }

  .folder-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; background: var(--surface); border: 1px solid var(--border);
    cursor: pointer; user-select: none; gap: 12px;
  }
  .folder-header:hover { border-color: #3a3a3a; }
  .folder-header-left { display: flex; align-items: center; gap: 12px; flex: 1; }
  .folder-chevron { font-size: 10px; color: var(--muted); transition: transform .2s; }
  .folder-section.open .folder-chevron { transform: rotate(90deg); }
  .folder-name { font-size: 13px; letter-spacing: 1px; }
  .folder-count { font-size: 11px; color: var(--muted); }

  .collections-list { border: 1px solid var(--border); border-top: none; display: none; }
  .folder-section.open .collections-list { display: block; }

  .collection-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px 10px 32px; border-bottom: 1px solid var(--border);
    transition: background .15s;
  }
  .collection-row:last-child { border-bottom: none; }
  .collection-row:hover { background: rgba(255,255,255,.03); }
  .collection-row.hidden-row { opacity: .45; }

  .collection-name { font-size: 13px; }
  .collection-id { font-size: 10px; color: var(--muted); margin-left: 8px; letter-spacing: 1px; }

  /* Toggle */
  .toggle { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider {
    position: absolute; inset: 0; background: var(--toggle-off);
    border-radius: 22px; cursor: pointer; transition: background .2s;
  }
  .toggle-slider::before {
    content: ''; position: absolute;
    width: 16px; height: 16px; left: 3px; top: 3px;
    background: #888; border-radius: 50%; transition: transform .2s, background .2s;
  }
  .toggle input:checked + .toggle-slider { background: var(--toggle-on); }
  .toggle input:checked + .toggle-slider::before { transform: translateX(18px); background: #fff; }

  .loader { padding: 48px; text-align: center; color: var(--muted); font-size: 13px; }
  .empty { padding: 32px; text-align: center; color: var(--muted); font-size: 13px; }

  /* Standalone collections (no folder) */
  .standalone-section { margin-bottom: 8px; }
  .standalone-header {
    padding: 10px 16px; font-size: 10px; letter-spacing: 2px;
    text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--border);
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h1>Stéphane Wagner · Admin</h1>
    <input type="password" id="passwordInput" placeholder="Mot de passe" autocomplete="current-password">
    <button onclick="tryLogin()">Accéder</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-left">
      <h1>Visibilité des collections</h1>
      <div class="stats" id="stats">—</div>
    </div>
    <div class="topbar-right">
      <span class="unsaved" id="unsavedBadge" style="display:none">● Non sauvegardé</span>
      <button class="btn btn-save" id="saveBtn" disabled onclick="saveConfig()">Sauvegarder</button>
      <button class="btn btn-logout" onclick="logout()">Déconnexion</button>
    </div>
  </div>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Rechercher une collection…" oninput="filterList()">
  </div>

  <div class="main" id="main">
    <div class="loader">Chargement des collections…</div>
  </div>
</div>

<script>
const PASSWORD  = 'sw2024';
const API_BASE  = 'https://www.photographie.stephanewagner.com/wp-json/wplr/v1';
const TOKEN     = 'EDNusnA0Q8TW';
const SAVE_URL  = './admin-save.php';

let config     = { collections: {}, folders: {} };
let hierarchy  = null;
let isDirty    = false;

// --- AUTH ---
function tryLogin() {
  const val = document.getElementById('passwordInput').value;
  if (val === PASSWORD) {
    sessionStorage.setItem('admin_auth', '1');
    document.getElementById('login').style.display    = 'none';
    document.getElementById('dashboard').style.display = 'block';
    init();
  } else {
    document.getElementById('loginError').textContent = 'Mot de passe incorrect.';
  }
}
document.getElementById('passwordInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') tryLogin();
});
function logout() {
  sessionStorage.removeItem('admin_auth');
  location.reload();
}
if (sessionStorage.getItem('admin_auth') === '1') {
  document.getElementById('login').style.display    = 'none';
  document.getElementById('dashboard').style.display = 'block';
  init();
}

// --- INIT ---
async function init() {
  const [hier, cfg] = await Promise.all([
    fetch(`${API_BASE}/hierarchy`, { headers: { Authorization: `Bearer ${TOKEN}` } }).then(r => r.json()),
    fetch(SAVE_URL).then(r => r.json()).catch(() => ({ collections: {}, folders: {} })),
  ]);
  hierarchy = hier;
  config    = cfg;
  renderDashboard();
}

// --- DATA ---
function isVisible(type, id) {
  const map = config[type] || {};
  return map[id] !== false; // absent = visible par défaut
}

function toggle(type, id, value) {
  if (!config[type]) config[type] = {};
  config[type][id] = value;
  markDirty();
  updateStats();
}

function markDirty() {
  isDirty = true;
  document.getElementById('unsavedBadge').style.display = 'inline';
  document.getElementById('saveBtn').disabled = false;
}

function updateStats() {
  const allC = countAll('collections');
  const hidC = countHidden('collections');
  const allF = countAll('folders');
  const hidF = countHidden('folders');
  document.getElementById('stats').innerHTML =
    `Collections : <span>${allC - hidC}</span>/${allC} visibles &nbsp;·&nbsp; ` +
    `Dossiers : <span>${allF - hidF}</span>/${allF} visibles`;
}

function countAll(type) {
  if (!hierarchy) return 0;
  return flatItems(type).length;
}
function countHidden(type) {
  return Object.values(config[type] || {}).filter(v => v === false).length;
}

function flatItems(type) {
  const result = [];
  function walk(node) {
    if (Array.isArray(node)) { node.forEach(walk); return; }
    if (!node || typeof node !== 'object') return;
    if (type === 'folders'     && node.type === 'folder')      result.push(node);
    if (type === 'collections' && node.type !== 'folder' && node.id) result.push(node);
    for (const k of ['children','items','galleries','collections']) {
      if (node[k]) walk(node[k]);
    }
  }
  walk(hierarchy);
  return result;
}

// --- RENDER ---
function renderDashboard() {
  const main = document.getElementById('main');
  if (!hierarchy) { main.innerHTML = '<div class="loader">Erreur de chargement.</div>'; return; }

  const folders = flatItems('folders');
  const allCols = flatItems('collections');

  // Associer chaque collection à son dossier parent
  const colsByFolder = {};
  const standaloneC  = [];

  function buildMap(node, currentFolder) {
    if (Array.isArray(node)) { node.forEach(n => buildMap(n, currentFolder)); return; }
    if (!node || typeof node !== 'object') return;
    if (node.type === 'folder') {
      for (const k of ['children','items','galleries','collections']) {
        if (node[k]) buildMap(node[k], node.id);
      }
      return;
    }
    if (node.id) {
      if (currentFolder) {
        if (!colsByFolder[currentFolder]) colsByFolder[currentFolder] = [];
        colsByFolder[currentFolder].push(node);
      } else {
        standaloneC.push(node);
      }
    }
  }
  buildMap(hierarchy, null);

  let html = '';

  // Dossiers + leurs collections
  folders.forEach(folder => {
    const cols    = colsByFolder[folder.id] || [];
    const visible = isVisible('folders', folder.id);
    html += `
    <div class="folder-section open" id="folder-section-${folder.id}">
      <div class="folder-header" onclick="toggleSection('${folder.id}')">
        <div class="folder-header-left">
          <span class="folder-chevron">▶</span>
          <span class="folder-name">${folder.name || folder.id}</span>
          <span class="folder-count">${cols.length} collection${cols.length > 1 ? 's' : ''}</span>
        </div>
        <label class="toggle" onclick="event.stopPropagation()">
          <input type="checkbox" ${visible ? 'checked' : ''} onchange="toggleFolder('${folder.id}', this.checked)">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="collections-list">
        ${cols.map(c => renderCollectionRow(c)).join('') || '<div class="empty">Aucune collection</div>'}
      </div>
    </div>`;
  });

  // Collections sans dossier
  if (standaloneC.length) {
    html += `<div class="standalone-section">
      <div class="standalone-header">Sans dossier</div>
      <div class="collections-list" style="display:block;border:1px solid var(--border);">
        ${standaloneC.map(c => renderCollectionRow(c)).join('')}
      </div>
    </div>`;
  }

  main.innerHTML = html || '<div class="empty">Aucune donnée.</div>';
  updateStats();
}

function renderCollectionRow(c) {
  const visible = isVisible('collections', c.id);
  return `
  <div class="collection-row ${visible ? '' : 'hidden-row'}" id="crow-${c.id}">
    <span>
      <span class="collection-name">${c.name || c.title || 'Sans nom'}</span>
      <span class="collection-id">ID ${c.id}</span>
    </span>
    <label class="toggle">
      <input type="checkbox" ${visible ? 'checked' : ''} onchange="toggleCollection('${c.id}', this.checked)">
      <span class="toggle-slider"></span>
    </label>
  </div>`;
}

function toggleSection(folderId) {
  document.getElementById(`folder-section-${folderId}`).classList.toggle('open');
}

function toggleFolder(id, value) {
  toggle('folders', id, value);
  const section = document.getElementById(`folder-section-${id}`);
  if (section) section.style.opacity = value ? '1' : '.5';
}

function toggleCollection(id, value) {
  toggle('collections', id, value);
  const row = document.getElementById(`crow-${id}`);
  if (row) row.classList.toggle('hidden-row', !value);
}

// --- SEARCH ---
function filterList() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  document.querySelectorAll('.collection-row').forEach(row => {
    const text = row.textContent.toLowerCase();
    row.style.display = (!q || text.includes(q)) ? '' : 'none';
  });
  document.querySelectorAll('.folder-section').forEach(section => {
    const visible = [...section.querySelectorAll('.collection-row')]
      .some(r => r.style.display !== 'none');
    section.style.display = (!q || visible) ? '' : 'none';
  });
}

// --- SAVE ---
async function saveConfig() {
  const btn = document.getElementById('saveBtn');
  btn.textContent = 'Sauvegarde…';
  btn.disabled = true;
  try {
    const resp = await fetch(SAVE_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(config),
    });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    isDirty = false;
    document.getElementById('unsavedBadge').style.display = 'none';
    btn.textContent = 'Sauvegardé ✓';
    setTimeout(() => { btn.textContent = 'Sauvegarder'; }, 2000);
  } catch (e) {
    btn.textContent = 'Erreur — réessayer';
    btn.disabled = false;
    alert('Erreur lors de la sauvegarde : ' + e.message);
  }
}

window.addEventListener('beforeunload', e => {
  if (isDirty) e.preventDefault();
});
</script>
</body>
</html>
