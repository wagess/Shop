<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photothèque — Stéphane Wagner</title>
    <link rel="stylesheet" href="./assets/styles/styles.css">
    <link rel="stylesheet" href="./assets/styles/musique.css">
    <link rel="stylesheet" href="./assets/styles/components/triptyque.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
</head>
<body>

    <header style="width: 100%; padding: var(--gap-large); display: flex; justify-content: space-between; align-items: center; background: rgba(0, 0, 0, 0); position: relative; top: 0; z-index: 100;">

        <div style="display: flex; align-items: center; gap: 12px;">
            <img src="./assets/svg/Stéphane Wagner.svg" alt="Logo Stéphane Wagner" style="width: 180px; height: auto; filter: invert(1);">
            <a href="/" target="_self" class="nav-button">
                <span class="nav-text">Shop</span>
                <span class="nav-icon" style="display: none;">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 4C3 3.44772 3.44772 3 4 3H16C16.5523 3 17 3.44772 17 4V16C17 16.5523 16.5523 17 16 17H4C3.44772 17 3 16.5523 3 16V4Z" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M7 3V17" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M11 3V17" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M15 3V17" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </a>
            <a href="/phototheque.html" target="_self" class="nav-button nav-button--active">
                <span class="nav-text">Photothèque</span>
            </a>
        </div>

        <div style="display: flex; align-items: center; gap: 16px;">

            <!-- Panier triptyque -->
            <button id="triptyque-cart" class="triptyque-cart" aria-label="Triptyque" onclick="window.openTriptyqueModal()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="6" width="20" height="14" rx="2"/>
                    <path d="M16 6V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/>
                    <line x1="12" y1="11" x2="12" y2="17"/>
                    <line x1="9" y1="14" x2="15" y2="14"/>
                </svg>
                <span id="triptyque-badge" class="triptyque-cart__badge">0</span>
            </button>

            <a href="https://www.photographie.stephanewagner.com/" target="_blank" class="nav-button">
                <span class="nav-text">Portfolio</span>
                <span class="nav-icon" style="display: none;">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 6C4 4.89543 4.89543 4 6 4H14C15.1046 4 16 4.89543 16 6V14C16 15.1046 15.1046 16 14 16H6C4.89543 16 4 15.1046 4 14V6Z" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="8.5" cy="8.5" r="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M4 13L7 10L10 13L14 9L16 11" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </a>
            <a href="https://www.blog.stephanewagner.com/" target="_blank" class="nav-button">
                <span class="nav-text">Stories</span>
                <span class="nav-icon" style="display: none;">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 4H16C16.5523 4 17 4.44772 17 5V15C17 15.5523 16.5523 16 16 16H4C3.44772 16 3 15.5523 3 15V5C3 4.44772 3.44772 4 4 4Z" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M6 7H14" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M6 10H14" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M6 13H11" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </span>
            </a>
        </div>
    </header>

    <div class="container">

        <!-- Barre de recherche -->
        <div class="search-field" style="margin-bottom: 20px; max-width: 100%;">
            <div class="search-field__icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 3C6.13401 3 3 6.13401 3 10C3 13.866 6.13401 17 10 17C11.7547 17 13.3554 16.3626 14.5858 15.3072L19.2929 20.0143C19.6834 20.4048 20.3166 20.4048 20.7071 20.0143C21.0976 19.6237 21.0976 18.9906 20.7071 18.6L16 13.8929C16.9157 12.7083 17.5 11.2136 17.5 9.57143C17.5 5.70544 14.366 3 10 3ZM5 10C5 7.23858 7.23858 5 10 5C12.7614 5 15 7.23858 15 10C15 12.7614 12.7614 15 10 15C7.23858 15 5 12.7614 5 10Z" fill="currentColor"/>
                </svg>
            </div>
            <div class="search-field__body">
                <input type="text" id="searchInput" class="search-field__input" placeholder="Rechercher une collection..." autocomplete="off">
                <span class="search-field__hint">Collections, albums, séries…</span>
                <div id="searchSuggestions"></div>
            </div>
            <div class="search-field__action">
                <button type="button" class="search-field__btn" id="searchSubmitBtn" aria-label="Lancer la recherche">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 8L10 13L15 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div style="text-align: center; margin-bottom: 10px;">
            <div class="stats" id="stats"></div>
        </div>

        <!-- Liens de navigation vers les dossiers (en haut) -->
        <div id="foldersContainerTop" style="margin: 20px; text-align: center;"></div>

        <!-- Loader -->
        <div class="loading" id="galleriesLoader">
            <div class="spinner"></div>
            Chargement des galeries...
        </div>

        <!-- Grille des galeries -->
        <div id="galleriesContainer" class="galleries-grid"></div>

        <!-- Liens de navigation vers les dossiers (en bas) -->
        <div id="foldersContainerBottom" style="margin: 40px; text-align: center;"></div>

    </div>

    <!-- Modale photos -->
    <div id="photosModal" class="photos-modal">
        <div class="modal-header">
            <button class="close-modal" id="closeModalBtn">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12.7071 4.29289C13.0976 4.68342 13.0976 5.31658 12.7071 5.70711L8.41421 10L12.7071 14.2929C13.0976 14.6834 13.0976 15.3166 12.7071 15.7071C12.3166 16.0976 11.6834 16.0976 11.2929 15.7071L6.29289 10.7071C5.90237 10.3166 5.90237 9.68342 6.29289 9.29289L11.2929 4.29289C11.6834 3.90237 12.3166 3.90237 12.7071 4.29289Z"></path>
                </svg>
            </button>
            <div class="modal-title" id="modalTitle" style="font-size: var(--font-size-large);"></div>
        </div>
        <div id="photosGrid" class="photos-grid"></div>
    </div>

    <script src="js/triptyque.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
