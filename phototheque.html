<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photothèque — Stéphane Wagner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400;1,500&amp;family=DM+Sans:wght@400;500&amp;display=swap">
    <link rel="stylesheet" href="./assets/styles/styles.css">
    <link rel="stylesheet" href="./assets/styles/components/triptyque.css">
    <link rel="stylesheet" href="./assets/styles/pages/accueil.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
</head>
<body class="ac-page">

    <div id="site-header-mount"></div>

    <div class="container mx-auto mb-10 mt-0">

        <!-- Barre de recherche -->
        <div class="search-field my-5 mx-auto" style="max-width: 100%;">
            <div class="search-field__icon py-2 pl-4">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 3C6.13401 3 3 6.13401 3 10C3 13.866 6.13401 17 10 17C11.7547 17 13.3554 16.3626 14.5858 15.3072L19.2929 20.0143C19.6834 20.4048 20.3166 20.4048 20.7071 20.0143C21.0976 19.6237 21.0976 18.9906 20.7071 18.6L16 13.8929C16.9157 12.7083 17.5 11.2136 17.5 9.57143C17.5 5.70544 14.366 3 10 3ZM5 10C5 7.23858 7.23858 5 10 5C12.7614 5 15 7.23858 15 10C15 12.7614 12.7614 15 10 15C7.23858 15 5 12.7614 5 10Z" fill="currentColor"/>
                </svg>
            </div>
            <div class="search-field__body pl-3">
                <input type="text" id="searchInput" class="search-field__input" placeholder="Rechercher une collection..." autocomplete="off">
                <span class="search-field__hint">Collections, albums, séries…</span>
                <div id="searchSuggestions"></div>
            </div>
            <div class="search-field__action py-2 pl-2 pr-2">
                <button type="button" class="search-field__btn" id="searchSubmitBtn" aria-label="Lancer la recherche">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 8L10 13L15 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Liens de navigation vers les dossiers (en haut) -->
        <div id="foldersContainerTop" class="m-5" style="text-align: center;"></div>

        <!-- Loader -->
        <div class="loading" id="galleriesLoader">
            <div class="spinner"></div>
            Chargement des galeries...
        </div>

        <!-- Grille des galeries -->
        <div id="galleriesContainer" class="galleries-grid gap-4 md:gap-5 mb-5 pt-3 md:pt-5 pr-3 md:pr-0 pb-3 md:pb-0 pl-3 md:pl-0"></div>

        <!-- Liens de navigation vers les dossiers (en bas) -->
        <div id="foldersContainerBottom" style="margin: 40px; text-align: center;"></div>

    </div>

    <!-- Modale photos — composant js/components/photos-modal.js -->
    <div id="photos-modal-mount"></div>

    <!-- ===== FOOTER NAVIGATION ===== -->
    <div id="site-footer-mount"></div>

    <script src="js/triptyque.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
